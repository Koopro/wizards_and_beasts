# OnePerWorldPlacement samples the biome source at placement time to pin the
# single Azkaban instance to an ocean; vanilla exposes randomState() but keeps
# the biome source private.
public net.minecraft.world.level.chunk.ChunkGeneratorStructureState biomeSource

# WornGeoCurioRenderer drives GeckoLib armour renderers from the Curios layer, and GeckoLib's render
# pass takes the frame's camera state; GeckoLib's own armour layer reads this same field (it ships the
# identical AT), so this only makes the field reachable at compile time.
public net.minecraft.client.renderer.LevelRenderer levelRenderState
